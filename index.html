<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will be in Avengers: Doomsday</title>
    <link rel="icon" type="image/x-icon" href="./assets/Alogo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Will be in <br><br>
            Avengers: Doomsday</h1>
        <img src="assets/Alogo.png" alt="Logo" class="logo" />
    </div>
</body>

<script>
    const logo = document.getElementsByClassName("logo");

    logo[0].addEventListener("animationend", (event) => {
    if (event.animationName === "exitUp") {
        window.location.href = "upload.html";
    }
    });
</script>
</html>
