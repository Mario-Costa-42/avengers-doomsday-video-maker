<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generating Trailer</title>
  <link rel="icon" type="image/x-icon" href="./assets/Alogo.png">
  <link rel="stylesheet" href="loading.css" />
</head>
<body>

  <main class="loading-container">
    <h1 class="loading-title">Loading your trailer</h1>
    <div class="loader"></div>
    <div class="progress-wrapper">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p class="loading-text">Assembling your character into the multiverse…</p>
    <canvas id="canvas" hidden></canvas>
    <video id="baseVideo" src="assets/AvengersDoom.mp4" hidden playsinline crossorigin="anonymous"></video>

    <div class="actions" id="actions" hidden>   </div>

    <a href="https://www.instagram.com/mario.code.lab/" target="_blank" class="button instagram" style="display: none; padding-right: 10px;">
        <img src="./assets/instagram.svg" alt="Ícone do Instagram" class="icon"/>
        INSTAGRAM
    </a>


  </main>

</body>
<script src="loading.js"></script>
</html>
